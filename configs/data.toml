# Data layer configuration (Phase 1).
# The panel is built for the full superset; analysis picks subsets below.

[panel]
start = "2000-01-03"          # warm-up for 12m features before the first decision (2008-01)
calendar_ticker = "SPY"       # master trading calendar
max_ffill_days = 5            # fill isolated vendor gaps only; longer gaps stay NaN
sentinel_price = 999999.0     # vendor placeholder prices at or above this are dropped

# Every ETF the project may touch (investable + context-pack proxies).
tickers = [
  "SPY", "EFA", "EEM",          # equity
  "IEF", "TLT", "TIP",          # government
  "LQD", "HYG", "EMB",          # credit
  "VNQ",                        # real estate
  "DBC", "GLD",                 # commodities
  "UUP",                        # USD
  "BIL",                        # cash
]

[universe]
# Investable set — one ETF per regime-relevant asset class. Proposed, pending sign-off.
investable = ["SPY", "EEM", "IEF", "TIP", "HYG", "DBC", "GLD", "BIL"]
cash = "BIL"
# Market block of the LLM context pack (long history, available before 2008).
context = ["SPY", "EFA", "EEM", "IEF", "TLT", "LQD", "GLD"]
benchmark_60_40 = { SPY = 0.6, IEF = 0.4 }

# Macro series. mode:
#   "vintage" — ALFRED real-time history; value used only from its publication date.
#   "lagged"  — latest values; available `lag_days` calendar days after the observation
#               period ends (for daily, never-revised market series, or series whose
#               ALFRED history starts too late — flagged in the manifest).
[macro]
observation_start = "2000-01-01"

[macro.series]
CFNAI    = { mode = "vintage", freq = "M" }
INDPRO   = { mode = "vintage", freq = "M" }
UNRATE   = { mode = "vintage", freq = "M" }
PAYEMS   = { mode = "vintage", freq = "M" }
CPIAUCSL = { mode = "vintage", freq = "M" }
CPILFESL = { mode = "vintage", freq = "M" }
DFF      = { mode = "lagged", freq = "D", lag_days = 1 }
DGS2     = { mode = "lagged", freq = "D", lag_days = 1 }
DGS10    = { mode = "lagged", freq = "D", lag_days = 1 }
T10Y2Y   = { mode = "lagged", freq = "D", lag_days = 1 }
VIXCLS   = { mode = "lagged", freq = "D", lag_days = 1 }
BAA10Y   = { mode = "lagged", freq = "D", lag_days = 1 }
DTWEXBGS = { mode = "vintage", freq = "D", fallback_lag_days = 7 }
